<!DOCTYPE html>
<html lang="es-AR">
<head>
<base href="/preonboarding/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Tu juego, conectado</title>
<style>
:root{
  --bg:#0a0a0a; --sup:#141414; --sup2:#1b1b1b; --borde:#2a2a2a;
  --rojo:#dc2626; --rojo-suave:#1f0e0e; --txt:#ffffff; --gris:#9ca3af; --gris2:#7b818c;
  --panel-w:460px;
  --fuente:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--txt);font-family:var(--fuente);font-size:16px;
  overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  display:grid;height:100vh;height:100svh;
  grid-template-columns:1fr auto;grid-template-rows:auto 1fr;
  grid-template-areas:"barra nav" "escena escena";
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
h1,h2,h3,p,ul,ol,dl,dd,q{margin:0;padding:0}
ul,ol{list-style:none}
q{quotes:"\201C" "\201D"}
.salto{position:absolute;left:-999px;top:8px;z-index:50;background:#fff;color:#000;padding:8px 12px;border-radius:8px;font-weight:700}
.salto:focus{left:8px}

/* ---------- barra superior ---------- */
.barra{grid-area:barra;display:flex;align-items:center;gap:20px;padding:9px 8px 9px 20px;min-width:0;border-bottom:1px solid #161616}
.marca{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.marca-sello{width:32px;height:32px;border-radius:8px;background:var(--rojo);display:grid;place-items:center;font-weight:800;font-size:11.5px;letter-spacing:.04em}
.marca-txt{display:flex;flex-direction:column;line-height:1.15}
.marca-txt b{font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.marca-txt span{font-size:12px;color:var(--gris)}
.riel{display:flex;gap:6px;flex:1 1 auto;min-width:0}
.riel li{flex:1 1 0;min-width:0}
.riel button{width:100%;min-height:36px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:5px;align-items:center;padding:4px 4px 2px;text-align:left;border-radius:8px}
.riel-n{width:22px;height:22px;border-radius:50%;border:1.5px solid #3a3a3a;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--gris)}
.riel-n:empty{width:8px;height:8px;border-width:0;background:#3a3a3a;margin:0 7px}
.riel-t{font-size:13.5px;font-weight:600;color:var(--gris2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riel-b{grid-column:1/-1;height:3px;border-radius:3px;background:#222;overflow:hidden}
.riel-b i{display:block;height:100%;width:0;background:var(--rojo);transition:width .4s ease}
.riel button[aria-current="step"] .riel-n{border-color:var(--rojo);background:var(--rojo);color:#fff}
.riel button[aria-current="step"] .riel-n:empty{background:var(--rojo)}
.riel button[aria-current="step"] .riel-t{color:#fff}
.riel button.hecho .riel-n{border-color:var(--rojo);color:#fff}

.nav{grid-area:nav;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-bottom:1px solid #161616}
.nav button{height:40px;min-width:44px;border-radius:10px;border:1px solid var(--borde);background:var(--sup);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:14.5px;font-weight:700}
.nav button:disabled{opacity:.3;cursor:default}
.nav .primario{background:var(--rojo);border-color:var(--rojo)}
.nav svg{width:16px;height:16px}
#abrir-prep{border-color:transparent;background:transparent;color:var(--gris2);min-width:40px;padding:0}
#abrir-prep:hover{color:#fff}
#cuenta{font-size:13px;color:var(--gris);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- escena ---------- */
.escena{grid-area:escena;position:relative;min-height:0;min-width:0;overflow:hidden}
#mapa{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:56px 56px}
#svg{width:100%;height:100%;display:block;transition:opacity .5s}
#svg.atenuado{opacity:.12}
#panel{position:absolute;left:20px;top:14px;bottom:14px;width:var(--panel-w);overflow-y:auto;overscroll-behavior:contain;
  background:rgba(20,20,20,.95);border:1px solid var(--borde);border-radius:20px;padding:24px 24px 22px;
  scrollbar-width:thin;scrollbar-color:#333 transparent}
body.p-hero #panel{bottom:auto;width:min(620px,50vw);background:transparent;border-color:transparent;padding:18px 8px 8px 12px;overflow:visible}
#capa{position:absolute;left:calc(20px + var(--panel-w) + 28px);right:24px;top:14px;bottom:14px;display:flex;align-items:center;justify-content:center;gap:20px}
#capa.modo-lado{left:auto;right:20px;width:var(--bw,260px);flex-direction:column;gap:8px}
#capa.modo-uni,#capa.modo-mods,#capa.modo-muro{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#333 transparent}
#capa.modo-corr,#capa.modo-forma{flex-direction:column;align-items:stretch;overflow-y:auto}
#capa.modo-corr>*,#capa.modo-forma>*{width:min(100%,640px);margin-left:auto;margin-right:auto}
/* pasos sin mapa (la corrección y las formas de trabajar): el ejemplo ocupa ese lugar */
body.p-solo #mapa,body.p-solo .ejemplo-chip{visibility:hidden}
/* el muro de victorias se come la pantalla entera: de borde a borde
   (el panel se esconde más abajo, solo en pantalla grande: en celular el muro vive ahí) */
body.p-muro #capa{left:20px}
.ejemplo-chip{position:absolute;right:16px;bottom:10px;font-size:12.5px;color:var(--gris2);letter-spacing:.02em;pointer-events:none;background:rgba(10,10,10,.75);padding:3px 10px;border-radius:999px}

/* ---------- mapa: nodos ---------- */
.nodo{cursor:pointer;transition:transform .95s cubic-bezier(.22,.8,.22,1),opacity .5s}
.sin-anim .nodo,.sin-anim .profe{transition:none!important}
.nodo-in{transform:rotate(var(--rot,0deg));animation:flotar var(--dur,6s) ease-in-out var(--del,0s) infinite;transition:transform .8s}
@keyframes flotar{0%,100%{transform:rotate(var(--rot,0deg)) translateY(0)}50%{transform:rotate(var(--rot,0deg)) translateY(-5px)}}
.m-sistema .nodo-in{animation:none;transform:none}
.pastilla{fill:#101010;stroke:#4a4a4a;stroke-width:1.5;stroke-dasharray:5 4;transition:fill .3s,stroke .3s,stroke-width .3s}
.nombre{fill:#b4b4bd;font-weight:650;text-anchor:middle;pointer-events:none;transition:fill .3s}
.m-sistema .pastilla{stroke-dasharray:none;fill:#171717;stroke:#3d3d3d}
.m-sistema .nombre{fill:#fff}
.nodo.oculta{opacity:0;pointer-events:none}
.m-sistema.recien .nodo.nueva{transition:transform .95s cubic-bezier(.22,.8,.22,1),opacity .6s ease .7s}
.m-sistema.recien .nodo.nueva .pastilla{stroke:var(--rojo)}
.m-islas.con-perfil .nodo .pastilla{stroke:var(--rojo);stroke-dasharray:none;fill:var(--rojo-suave);stroke-width:1.8}
.m-islas.con-perfil .nodo .nombre{fill:#fff}
.m-islas .nodo.perdida .pastilla{stroke:#fff;stroke-dasharray:none}
.m-islas .nodo.perdida .nombre{fill:#fff}
.nodo.activa .pastilla{fill:var(--rojo);stroke:var(--rojo)}
.nodo.destino .pastilla{stroke:var(--rojo);stroke-width:2.2}
.nodo.enhilo .pastilla{stroke:var(--rojo);stroke-width:2.4;fill:var(--rojo-suave)}
.hay-foco .nodo:not(.activa):not(.destino):not(.enhilo):not(.oculta){opacity:.38}
.nodo:focus-visible{outline:none}
.nodo:focus-visible .pastilla{stroke:#fff;stroke-width:2.6;stroke-dasharray:none}
.etiqueta{fill:var(--gris);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-anchor:middle;opacity:0;pointer-events:none}
.con-etiquetas .etiqueta{opacity:1;transition:opacity .35s ease calc(var(--px,0) * 1.5s + .15s)}
.duda{opacity:0;transition:opacity .3s;pointer-events:none}
.m-islas .nodo.perdida .duda{opacity:1}
.duda line{stroke:#8a8a93;stroke-width:1.5;stroke-dasharray:3 4}
.duda text{fill:#fff;font-size:17px;font-weight:800;text-anchor:middle}
.frase{fill:#8a8a93;font-size:18px;font-style:italic;font-weight:500;text-anchor:middle;opacity:0;transition:opacity .6s;pointer-events:none}
.con-frases .frase{opacity:.95}
.frase-in{animation:flotar var(--dur,7s) ease-in-out var(--del,0s) infinite}

/* ---------- mapa: carriles, aristas ---------- */
.col{opacity:0;transition:opacity .6s ease .2s}
.m-sistema .col{opacity:1}
.col-banda{fill:rgba(255,255,255,.022);stroke:rgba(255,255,255,.05)}
.col-t{fill:#d4d4d8;font-weight:750;letter-spacing:.09em;text-anchor:middle}
.col-q{fill:var(--gris2);font-size:12px;text-anchor:middle}
.arista{fill:none;stroke:#63636b;stroke-width:1.7;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;stroke-linecap:round;
  transition:stroke-dashoffset .9s ease var(--d,0s),opacity .35s,stroke .7s,stroke-width .3s}
.punta{fill:#63636b;opacity:0;transition:opacity .3s,fill .7s}
.m-sistema .ar.viva .arista{stroke-dashoffset:0;opacity:.8}
.m-sistema .ar.viva .punta{opacity:.9;transition:opacity .35s ease calc(var(--d,0s) + .75s),fill .7s}
.recien .ar.viva .arista,.todo-rojo .ar.viva .arista{stroke:var(--rojo)}
.recien .ar.viva .punta,.todo-rojo .ar.viva .punta{fill:var(--rojo)}
.hay-foco .ar.viva:not(.on):not(.semana) .arista{opacity:.14}
.hay-foco .ar.viva:not(.on):not(.semana) .punta{opacity:.14}
.m-sistema .ar.semana .arista{stroke:var(--rojo);opacity:.75;stroke-width:2.2}
.m-sistema .ar.semana .punta{fill:var(--rojo);opacity:.8}
.m-sistema .ar.on .arista{stroke:var(--rojo);stroke-width:3;opacity:1}
.m-sistema .ar.on .punta{fill:var(--rojo);opacity:1}
.toque{fill:none;stroke:transparent;stroke-width:14;pointer-events:none;cursor:pointer}
.m-sistema.flechas-vivas .ar.viva .toque{pointer-events:stroke}
.toque:focus-visible{outline:none;stroke:rgba(255,255,255,.35)}
.rot{opacity:0;transition:opacity .3s;pointer-events:none}
.m-sistema .rot.on{opacity:1}
.rot rect{fill:#0a0a0a;stroke:var(--rojo);stroke-width:1.2}
.rot text{fill:#fff;font-size:14px;font-weight:600;text-anchor:middle}
.rot.num rect{fill:var(--rojo)}
.rot.num text{font-size:11px;font-weight:800}
.hilo-linea{fill:none;stroke:var(--rojo);stroke-width:2.5;stroke-dasharray:7 7;opacity:0;transition:opacity .4s;animation:correr 1.2s linear infinite}
@keyframes correr{to{stroke-dashoffset:-14}}
.con-hilo .hilo-linea{opacity:.9}
.profe{opacity:0;transition:transform .8s cubic-bezier(.22,.8,.22,1),opacity .4s;pointer-events:none}
.con-profe .profe{opacity:1}
.profe-c{fill:var(--rojo);stroke:#0a0a0a;stroke-width:2}
.profe-t{fill:#fff;font-size:9px;font-weight:800;letter-spacing:.05em;text-anchor:middle}
.profe-pulso{fill:none;stroke:var(--rojo);stroke-width:2;animation:pulso 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulso{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.barrido{opacity:0}
.barriendo .barrido{animation:barrer 1.7s ease-in-out 1}
@keyframes barrer{0%{transform:translateX(0);opacity:1}90%{opacity:1}100%{transform:translateX(var(--w,1000px));opacity:0}}
.barrido-l{fill:var(--rojo)}
.barrido-h{fill:var(--rojo);opacity:.09}

.nota{position:absolute;z-index:3;background:#0d0d0d;border:1px solid var(--rojo);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;animation:aparecer .35s ease both}
.nota small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--rojo);margin-bottom:3px;text-transform:uppercase}
.nota.nota-duda{border-color:#fff;font-size:20px;font-weight:800;padding:8px 16px;width:auto!important;white-space:nowrap}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- panel: tipografía ---------- */
.entra>*{animation:aparecer .45s ease both}
.entra>*:nth-child(2){animation-delay:.05s}.entra>*:nth-child(3){animation-delay:.1s}.entra>*:nth-child(4){animation-delay:.15s}.entra>*:nth-child(n+5){animation-delay:.2s}
.kicker{font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--rojo);margin-bottom:10px}
h1{font-size:clamp(38px,5vw,72px);line-height:1;font-weight:850;letter-spacing:-.025em}
h2{font-size:clamp(25px,2.4vw,34px);line-height:1.08;font-weight:800;letter-spacing:-.015em}
.bajada{color:#c4c4cc;font-size:17px;line-height:1.4;margin-top:10px}
body.p-hero .bajada{font-size:clamp(18px,1.9vw,26px);color:#d4d4d8;max-width:36ch}
.toca{display:flex;align-items:center;gap:8px;color:var(--gris);font-size:15px;margin-top:16px}
.bloque{margin-top:16px}
.sub{font-size:12.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--gris2);margin-bottom:8px}
.chica{font-size:15px;color:var(--gris);line-height:1.4;margin-top:12px}
.chica.fuerte{color:#fff;border-left:3px solid var(--rojo);padding-left:12px}

.cifras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cifras.una{grid-template-columns:1fr;max-width:330px}
.cifra{background:var(--sup2);border:1px solid var(--borde);border-radius:16px;padding:14px 16px}
.cifra b{display:block;font-size:52px;line-height:1;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cifra span{font-size:15px;color:var(--gris);line-height:1.25;display:block;margin-top:4px}
.cifra.acento{border-color:var(--rojo);background:var(--rojo-suave)}
.cifra.acento b{color:var(--rojo)}

/* ---------- figura ---------- */
.fig .p{stroke:#6a6a74;fill:#6a6a74;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,fill .3s}
.fig .dest{stroke:var(--rojo);fill:var(--rojo)}
.fig .piso{stroke:#333;stroke-width:1.5}
.fig .regla{stroke:#4a4a4a;stroke-width:1.2}
.fig .regla.dest{stroke:var(--rojo);stroke-width:2}
.fig .medida{stroke:#444;stroke-width:1;stroke-dasharray:2 3}
.fig .rotulo-l{stroke:var(--rojo);stroke-width:1.5;fill:none}
.fig .rotulo-t{fill:#fff;font-size:15px;font-weight:750}

/* ---------- pilar 1 ---------- */
.mira{display:grid;grid-template-columns:150px 1fr;gap:16px;margin-top:16px;align-items:center}
.mira-fig svg{width:150px;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips li,.chips button{border:1px solid var(--borde);background:var(--sup2);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600;color:#e4e4e7;transition:border-color .2s,background .2s}
.chips button.on,.chips button:hover{border-color:var(--rojo);background:var(--rojo-suave);color:#fff}
.chips + .sub{margin-top:14px}

/* ---------- los 7 modelos (paso 4) ----------
   A propósito NO son siete tarjetas iguales con el mismo radio y la misma sombra:
   es una lista numerada con una regla a la izquierda. Así la pantalla se lee de
   arriba abajo, el número ordena la charla ("el 3, el pesado") y lo que pesa es
   el nombre del modelo, no la decoración. */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;width:100%;align-self:center}
.mod{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:baseline;text-align:left;width:100%;
  padding:10px 12px 11px 8px;border-bottom:1px solid #1e1e1e;border-left:2px solid transparent;
  transition:border-color .2s,background .2s}
.mod:hover,.mod:focus-visible{border-left-color:var(--rojo);background:rgba(220,38,38,.07)}
.mod[aria-pressed="true"]{border-left-color:var(--rojo);background:var(--rojo-suave)}
.mod-n{font-size:21px;font-weight:850;color:#3f3f46;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mod:hover .mod-n,.mod:focus-visible .mod-n,.mod[aria-pressed="true"] .mod-n{color:var(--rojo)}
.mod b{display:block;font-size:16.5px;line-height:1.15;font-weight:800}
.mod span{display:block;font-size:14.5px;line-height:1.3;color:#a1a1aa;margin-top:3px}

/* ---------- la ficha del modelo (paso 5) ----------
   Los cuatro bloques tienen pesos distintos a propósito: las viñetas se leen
   primero, el diagnóstico va en blanco y más grande, la propuesta lleva la barra
   roja (es lo que compra) y el caso parecido queda al pie, más chico, como una
   nota al margen. Nada centrado. */
.cuerpos-fila{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cuerpos-fila button{border:1px solid var(--borde);background:var(--sup2);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--gris)}
.cuerpos-fila button[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo-suave);color:#fff}
.ident li{position:relative;padding:5px 0 5px 20px;font-size:15.5px;line-height:1.35;color:#e4e4e7}
.ident li::before{content:"";position:absolute;left:0;top:14px;width:11px;height:2px;background:var(--rojo)}
.diag{font-size:18px;line-height:1.35;color:#fff;margin-top:5px}
.propuesta{font-size:16.5px;line-height:1.4;color:#fff;border-left:3px solid var(--rojo);padding-left:13px;margin-top:5px}
.caso{margin-top:18px;padding:12px 15px;border-left:2px solid #3f3f46;background:#121212;border-radius:0 14px 14px 0;font-size:14.5px;line-height:1.4;color:#c4c4cc}
.caso em{font-style:normal;display:block;font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--gris2);margin-bottom:4px}
.armamos li{position:relative;padding:4px 0 4px 18px;font-size:15.5px;line-height:1.35;color:#e4e4e7}
.armamos li::before{content:"";position:absolute;left:0;top:13px;width:9px;height:2px;background:var(--rojo)}
.armamos.ajustes li{color:#fff}
.armamos.ajustes li b{display:block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--rojo)}
.bocado-pie{font-size:14.5px;line-height:1.3;text-align:center;width:100%}
.bocado-pie b{display:block;font-size:15.5px}
.bocado-pie small{display:block;color:var(--gris);font-size:13.5px}
.bocado-pie .fila-btn{justify-content:center;margin-top:6px}
.bocado-movil{margin-top:16px;display:grid;justify-items:center;gap:8px}
.bocado-movil .marco{width:min(64vw,250px)}

/* ---------- universo de técnicas (paso 3) ----------
   Momento 1 (sin .sub1): TODO lo que existe, chiquito y gris. La lista se corta
   contra el borde y sigue: no hay contador porque no son un número cerrado.
   Momento 2 (.sub1): se apaga lo que no entra en el recorte de ejemplo (no
   desaparece: el contraste es el mensaje) y quedan 5 por fundamento.
   Las transiciones se apagan solas con prefers-reduced-motion (regla del final del CSS). */
.uni{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-content:start;margin-top:16px;width:100%}
#capa .uni{margin-top:0}
/* La grilla del universo se escribe SIEMPRE en el panel, y en pantalla grande
   la tapa esta regla. Antes se decidía en JavaScript con la variable `movil`,
   que se actualiza al escuchar el cambio de tamaño: si ese aviso no llegaba
   (pasa al cambiar el tamaño de la ventana), el celular se quedaba sin la
   grilla y el paso aparecía vacío. La consulta de medios, en cambio, siempre
   mira el ancho de verdad. */
@media (min-width:820px){ #panel .uni-caja{display:none} body.p-muro #panel{display:none} }
.uni-g{min-width:0}
.uni-t{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gris2);border-bottom:1px solid #242424;padding-bottom:5px;margin-bottom:7px}
.uni-l{display:flex;flex-wrap:wrap;gap:4px}
.uni-i{max-width:100%;border:1px solid #232323;background:#121212;border-radius:999px;padding:2px 8px;
  font-size:11px;line-height:1.2;font-weight:600;color:#6a6a74;
  transition:color .5s ease,border-color .5s ease,background .5s ease,opacity .5s ease,font-size .35s ease}
/* "y sigue…": el cierre de cada columna que dice que la lista no termina acá */
.uni-sigue{border-style:dashed;border-color:#2f2f2f;background:transparent;font-style:italic;color:#55555e}
.uni.sub1 .uni-i{opacity:.12}
.uni.sub1 .uni-sigue{opacity:0}
.uni.sub1 .uni-i.tuya{opacity:1;color:#fff;font-weight:750;font-size:13.5px;border-color:var(--rojo);background:var(--rojo-suave)}
/* El degradado del pie refuerza que la lista se corta contra el borde.
   position:sticky para que quede pegado abajo aunque el contenedor scrollee. */
.uni-fade{position:sticky;bottom:-2px;height:64px;margin-top:-64px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,10,10,0),var(--bg));transition:opacity .5s ease}
.uni.sub1 + .uni-fade{opacity:0}
#panel .uni-fade{background:linear-gradient(to bottom,rgba(20,20,20,0),var(--sup))}
/* "el toreo no es una técnica, es un mundo": aparece solo en el segundo momento */
/* el bloque del universo adentro del panel del paso 1, separado de lo que miramos */
.uni-texto{margin-top:20px;padding-top:16px;border-top:1px solid #242424}
.uni-texto .chica{margin-top:8px}
.uni-resto{opacity:0;transition:opacity .5s ease}
.uni-resto.ver{opacity:1}

/* ---------- pausa ---------- */
.cadena{display:flex;align-items:center;gap:0;margin-bottom:18px}
.cadena li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--gris2)}
.cadena li + li::before{content:"";width:26px;height:2px;background:#333;margin:0 8px}
.cadena i{font-style:normal;width:34px;height:34px;border-radius:50%;border:2px solid #3a3a3a;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto}
.cadena i svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cadena li.hecho{color:#fff}
.cadena li.hecho i{background:var(--rojo);border-color:var(--rojo)}
.cadena li.hecho + li::before{background:var(--rojo)}
.cadena li.sigue{color:#fff}
.cadena li.sigue i{border-color:var(--rojo);animation:latir 1.6s ease-in-out infinite}
@keyframes latir{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}50%{box-shadow:0 0 0 9px rgba(220,38,38,0)}}
.resumen{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.resumen li{border:1px solid #5b1a1a;background:var(--rojo-suave);border-radius:999px;padding:5px 12px;font-size:14.5px;font-weight:650}

/* ---------- antes / después ---------- */
.ad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ad button{border:1px solid var(--borde);border-radius:14px;background:var(--sup2);padding:8px 8px 9px;text-align:left;transition:border-color .2s}
.ad button[aria-pressed="true"]{border-color:var(--rojo)}
.ad svg{width:100%;height:auto;display:block;border-radius:8px;background:#0c0c0c}
.ad span{display:block;font-size:13px;font-weight:800;letter-spacing:.1em;margin-top:7px;color:var(--gris)}
.ad button[aria-pressed="true"] span{color:#fff}
.mini-p{fill:#8a8a93}.mini-l{stroke:var(--rojo);stroke-width:1.2;opacity:.8}.mini-r{fill:#fff}

/* ---------- concepto / recorrido ---------- */
.tarjeta{background:var(--sup2);border:1px solid var(--borde);border-radius:16px;padding:16px;margin-top:16px}
.tarjeta .tag{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--gris2);text-transform:uppercase}
.tarjeta h3{font-size:25px;font-weight:850;letter-spacing:-.01em;margin:2px 0 10px}
.concepto{font-size:18px;line-height:1.35;border-left:3px solid var(--rojo);padding-left:12px;color:#fff}
/* 2 o 3 conceptos por posición: el primero manda (blanco, más grande) y los que
   siguen acompañan. Numerados para poder nombrarlos en voz alta en la llamada. */
.conceptos li{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;padding:7px 0;border-top:1px solid #242424}
.conceptos li:first-child{border-top:0;padding-top:0}
.conceptos i{font-style:normal;font-size:12px;font-weight:850;color:var(--rojo);padding-top:3px;font-variant-numeric:tabular-nums}
.conceptos span{font-size:16px;line-height:1.35;color:#c4c4cc}
.conceptos li:first-child span{font-size:18px;color:#fff}
.salidas li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #242424;font-size:15.5px;line-height:1.3}
.salidas li:first-child{border-top:0}
.salidas .n{width:22px;height:22px;border-radius:50%;background:var(--rojo);font-size:12px;font-weight:800;display:grid;place-items:center}
.salidas .si{color:var(--gris)}
.salidas button{font-weight:750;text-align:left;min-height:24px}
.salidas button:hover{color:var(--rojo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--borde);background:var(--sup2);font-size:15px;font-weight:700;line-height:1.2;text-align:left;transition:border-color .2s;text-decoration:none;color:#fff}
.btn:hover{border-color:var(--rojo)}
.btn.rojo{background:var(--rojo);border-color:var(--rojo)}
.btn.ancho{width:100%;margin-top:14px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo-suave)}
.hilo-lista li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-top:1px solid #242424;font-size:15px;line-height:1.3}
.hilo-lista li:first-child{border-top:0}
.hilo-lista b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rojo);padding-top:2px}
.hilo-lista small{display:block;color:var(--gris2);font-size:13px;margin-top:1px}
.cr svg{width:100%;height:auto;display:block;margin-top:10px}
.linea{margin-top:18px;position:relative}
.linea li{position:relative;padding:0 0 16px 40px;opacity:.32;transition:opacity .4s}
.linea li.on{opacity:1}
.linea li::before{content:"";position:absolute;left:12px;top:26px;bottom:-2px;width:2px;background:#333}
.linea li.on.pasada::before{background:var(--rojo)}
.linea li:last-child::before{display:none}
.linea i{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;border:2px solid #4a4a52;display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:800;background:var(--sup)}
.linea li.on i{border-color:var(--rojo);background:var(--rojo)}
.linea b{display:block;font-size:19px;line-height:1.25}
.linea small{display:block;font-size:15px;color:var(--gris);margin-top:2px}
.linea small em{font-style:normal;color:var(--gris2);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}

/* ---------- entrenamiento ---------- */
.tramo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:16px;font-weight:800}
.tramo span{background:var(--rojo-suave);border:1px solid var(--rojo);border-radius:999px;padding:4px 12px}
.tramo svg{width:18px;height:18px;stroke:var(--rojo);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.etapas{margin-top:12px;display:grid;gap:8px}
.etapa{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--sup2);border:1px solid var(--borde);border-radius:14px;padding:10px 12px}
.etapa-n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rojo);display:grid;place-items:center;font-size:13px;font-weight:800}
.etapa b{display:block;font-size:16px}
.etapa small{display:block;font-size:14.5px;color:#c4c4cc;line-height:1.3;margin-top:1px}
.resis{display:flex;gap:3px;align-items:flex-end;height:24px}
.resis i{width:6px;border-radius:2px;background:#333}
.resis i:nth-child(1){height:8px}.resis i:nth-child(2){height:13px}.resis i:nth-child(3){height:18px}.resis i:nth-child(4){height:24px}
.resis i.on{background:var(--rojo)}
.resis-t{font-size:11.5px;color:var(--gris2);text-align:right;margin-top:2px;letter-spacing:.03em}
.clase{margin-top:16px}
.clase-seg{display:flex;gap:3px}
.clase-seg div{min-width:0}
.clase-seg i{display:block;height:18px;border-radius:5px;background:#2b2b2b}
.clase-seg .propio i{background:var(--rojo)}
.clase-seg span{display:block;font-size:12.5px;line-height:1.2;color:var(--gris);margin-top:5px}
.clase-seg .propio span{color:#fff;font-weight:750}
/* Dónde entra el bloque de 10 a 15 minutos: tres lugares posibles, ninguno suma
   horas ni cambia de academia. Van como opciones, no como pasos. */
.dondeva{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dondeva li{border:1px dashed #4a4a52;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:650;color:#d4d4d8}
.sinbloque{margin-top:10px;font-size:14.5px;line-height:1.4;color:#c4c4cc;border-left:2px solid #3f3f46;padding-left:11px}
.semlist{display:grid;gap:8px;margin-top:14px}
.semlist button{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--sup2);border:1px solid var(--borde);border-radius:14px;padding:11px 12px;opacity:.4;transition:opacity .3s,border-color .3s}
.semlist button.pasada{opacity:1;border-color:#5b1a1a}
.semlist button[aria-pressed="true"]{opacity:1;border-color:var(--rojo);background:var(--rojo-suave)}
.semlist .cuad{display:grid;grid-template-columns:repeat(4,9px);gap:3px}
.semlist .cuad i{width:9px;height:9px;border-radius:2px;background:#333}
.semlist .cuad i.on{background:var(--rojo)}
.semlist em{font-style:normal;display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.semlist b{display:block;font-size:16px;line-height:1.25;font-weight:650}

/* ---------- acompañamiento ---------- */
.marco{position:relative;border-radius:16px;overflow:hidden;background:#0c0c0c;border:1px solid var(--borde)}
.marco iframe,.marco video,.marco img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
.v169{aspect-ratio:16/9}
.v916{aspect-ratio:9/16}
.marco.vacio{border:1.5px dashed #4a4a52;display:grid;place-items:center;text-align:center}
.vacio-in{padding:14px;color:var(--gris);font-size:15px;line-height:1.35;display:grid;gap:10px;justify-items:center}
.vacio-in small{font-size:12.5px;color:var(--gris2)}
.vacio-in svg{width:38px;height:38px;fill:none;stroke:var(--rojo);stroke-width:1.8}
button.marco.poster{display:grid;place-items:center;text-align:center;width:100%;cursor:pointer;transition:border-color .2s}
button.marco.poster:hover{border-color:var(--rojo)}
.marco svg.mock-lucha{display:block;width:100%;height:auto}
.marco-btn{display:block;width:100%;margin-top:14px;border-radius:16px}
.burbuja{position:absolute;right:3%;top:5%;width:56%;background:#fff;color:#111;border-radius:12px 12px 12px 3px;padding:8px 11px;font-size:13.5px;line-height:1.3;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.burbuja small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rojo);margin-bottom:2px}
#luz .burbuja{font-size:clamp(15px,1.5vw,21px);padding:12px 16px;width:50%}
#luz .burbuja small{font-size:12.5px}
.pie{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--gris2);margin-top:6px}
.pie a,.bocado-pie a,.testi-pie a{color:var(--gris);text-decoration:underline}
.ciclo{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px;text-align:center;font-size:13.5px;color:#d4d4d8;line-height:1.25;position:relative}
.ciclo li{position:relative}
.ciclo b{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;border:1.5px solid var(--rojo);color:#fff;font-size:13px;background:var(--sup)}
.ciclo li + li::before{content:"";position:absolute;left:calc(-50% + 18px);right:calc(50% + 18px);top:14px;height:1.5px;background:#5b1a1a}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.tabs button{border:1px solid var(--borde);background:var(--sup2);border-radius:12px;padding:10px 4px;min-height:44px;font-size:15px;font-weight:800;color:var(--gris)}
.tabs button[aria-selected="true"]{background:var(--rojo);border-color:var(--rojo);color:#fff}
.forma h3{font-size:20px;font-weight:800;margin-top:14px}
.forma p{font-size:15.5px;color:#c4c4cc;line-height:1.35;margin-top:3px}
.captura{margin-top:12px}
.captura img{position:static;display:block;width:auto;max-width:100%;height:auto;max-height:60vh;margin:0 auto;border-radius:10px}
.captura .marco{border:0;background:none;border-radius:0}
#capa .captura img{max-height:80vh}
.mock{margin-top:12px;border:1px solid var(--borde);border-radius:16px;background:#0e0e0e;padding:12px;font-size:14.5px}
.mock-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:8px}
.mock-top em{font-style:normal;font-size:10.5px;letter-spacing:.1em;color:var(--gris2);border:1px solid #333;border-radius:999px;padding:2px 8px}
.mock-fila{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--sup2);margin-top:6px}
.mock-mini{width:44px;height:30px;border-radius:6px;background:#262626;position:relative}
.mock-mini::after{content:"";position:absolute;left:17px;top:9px;border-left:10px solid #777;border-top:6px solid transparent;border-bottom:6px solid transparent}
.mock-fila small{display:block;color:var(--gris);font-size:13px}
.mock-fila .ok{color:var(--rojo);font-weight:800;font-size:12.5px}
.mock-cta{margin-top:8px;border-radius:10px;background:var(--rojo);text-align:center;font-weight:800;padding:9px}
/* Cómo se ve el feedback adentro de la app: el texto del profesor ENCIMA del
   video, con el minuto. Es la prueba que más convence; el marcador solo no alcanza. */
.mock-video{position:relative;margin-top:8px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 90% at 60% 40%,#1d1d1d 0%,#0c0c0c 70%)}
.mock-video .mv-etq{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.75);border-radius:999px;
  padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff}
.mock-video .mv-etq b{color:var(--rojo)}
.mock-video .mv-nota{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,10,10,.92);
  border:1px solid var(--rojo);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.3;color:#fff}
.mock-video .mv-barra{position:absolute;left:8px;right:8px;bottom:0;height:20px}
.mock-video .mv-barra i{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:3px;background:#333}
.mock-video .mv-barra u{position:absolute;top:6px;width:9px;height:9px;border-radius:50%;background:var(--rojo)}
/* Las notas que quedan de esa misma lucha: se nombran, no se muestran todas abiertas. */
.notas li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid #242424;font-size:15px;line-height:1.35}
.notas li:first-child{border-top:0}
.notas b{color:var(--rojo);font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.chat{display:grid;gap:6px}
.chat div{max-width:86%;padding:8px 11px;border-radius:12px;line-height:1.3}
.chat .yo{justify-self:end;background:#262626;border-bottom-right-radius:4px}
.chat .el{justify-self:start;background:var(--rojo-suave);border:1px solid #5b1a1a;border-bottom-left-radius:4px}
.chat .audio{display:flex;align-items:center;gap:8px;min-width:180px}
.chat .audio i{flex:1;height:3px;border-radius:3px;background:#7f1d1d;position:relative}
.chat .audio i::after{content:"";position:absolute;left:30%;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--rojo)}
.chat small{color:var(--gris);font-size:12px}
.chat .audio .tri{flex:0 0 auto;width:0;height:0;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.llamada{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.llamada .t{aspect-ratio:16/9;border-radius:10px;background:var(--sup2);display:grid;place-items:center;position:relative;color:var(--gris);font-size:12.5px}
.llamada .t::before{content:"";width:34px;height:34px;border-radius:50%;background:#333}
.llamada .t span{position:absolute;left:8px;bottom:6px}
.llamada .t.es-profe::before{background:var(--rojo)}
.agenda{margin-top:8px;display:grid;gap:4px;color:#e4e4e7}
.agenda li{display:flex;gap:8px}
.agenda li b{color:var(--rojo)}

.testi{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.testi .marco{width:var(--tw,220px);height:var(--th,391px);aspect-ratio:auto}
.testi-pie b{display:block;font-size:16px}
.testi-pie small{display:block;color:var(--gris);font-size:14px;max-width:var(--tw,220px)}
.carrusel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin-top:14px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.carrusel .testi{scroll-snap-align:center}
.carrusel .testi .marco{width:min(64vw,260px);height:auto;aspect-ratio:9/16}
.lista-testi li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid #242424;font-size:16px}
.lista-testi li:first-child{border-top:0}
.lista-testi i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rojo);display:grid;place-items:center;font-size:12.5px;font-weight:800}
.lista-testi small{display:block;color:var(--gris);font-size:14.5px}

/* ---------- el muro de victorias (última pantalla) ----------
   Sin filtro ni título abajo de cada una a propósito (22/9 → 23/9: Sebastián lo pidió
   "como Discord"): un muro que se scrollea y muestra las victorias, nada más. Las
   imágenes se recortan para llenar la tarjeta (object-fit:cover más abajo) en vez de
   quedar con cajas negras arriba y abajo. */
.muro-aviso{margin:0 0 12px}
/* Galería en 4 columnas (2 en celular), como las fotos de un canal de Discord: cada
   captura con su forma real, sin marco ni fondo, y se scrollea para abajo. 4 por fila
   para que no sea tanto scroll (23/9). */
.muro{columns:4 220px;column-gap:14px;padding:6px 0 40px}
.vic{break-inside:avoid;margin:0 0 14px}
.vic button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.vic img,.vic video{display:block;width:100%;height:auto;border-radius:8px}
.vic video{background:#000}

.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- lightbox / preparar / avisos ---------- */
#luz,#prep{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
#luz-caja{position:relative;display:grid;gap:10px;justify-items:center;max-width:100%}
#luz .marco.v916{height:min(84vh,calc((100vw - 32px) * 16 / 9));height:min(84svh,calc((100vw - 32px) * 16 / 9));width:auto}
#luz .marco.v169{width:min(92vw,calc(80vh * 16 / 9))}
#luz .marco.libre{width:min(92vw,1100px);aspect-ratio:auto}
#luz .marco.libre img{position:static;width:100%;height:auto;max-height:82vh;object-fit:contain}
.cerrar-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:var(--sup);border:1px solid var(--borde);display:grid;place-items:center}
#luz-x{position:fixed}
.cerrar-x svg{width:18px;height:18px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round}
#luz-t{font-size:16px;color:#d4d4d8;text-align:center;max-width:70ch}
#luz-t a{color:var(--gris)}
#prep-caja{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--sup);border:1px solid var(--borde);border-radius:20px;padding:24px}
#prep h2{font-size:24px;padding-right:48px}
#prep label{display:block}
#prep input[type="text"]{width:100%;height:46px;border-radius:12px;border:1px solid var(--borde);background:#0e0e0e;padding:0 14px;font-size:16px}
#prep input[type="text"]:focus-visible{outline:2px solid #fff;outline-offset:2px}
.prep-ops{display:flex;flex-wrap:wrap;gap:6px}
.prep-ops button{border:1px solid var(--borde);background:var(--sup2);border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px;font-weight:650;color:#d4d4d8}
.prep-ops button[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo-suave);color:#fff}
#prep-msj{font-size:14px;color:var(--gris);margin-top:8px;min-height:18px}
#pista{position:fixed;left:20px;bottom:10px;z-index:6;font-size:13px;color:var(--gris);background:rgba(10,10,10,.85);border:1px solid #242424;border-radius:999px;padding:4px 12px;pointer-events:none;opacity:0;transition:opacity .3s}
#pista.ver{opacity:1}
#aviso{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:#2a0f0f;border:1px solid var(--rojo);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;max-height:40vh;overflow:auto}
#aviso b{display:block;margin-bottom:4px}
.solo-movil{display:none}

/* ---------- celular ---------- */
@media (max-width:819px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"barra" "escena" "nav"}
  .barra{padding:8px 12px;gap:12px}
  .marca-txt{display:none}
  .riel{gap:4px}
  .riel li{flex:0 0 auto}
  .riel li.actual{flex:1 1 auto}
  .riel button{grid-template-columns:auto auto;justify-content:start}
  .riel li:not(.actual) .riel-t{display:none}
  .riel-n:empty{margin:0 4px}
  .nav{border-bottom:0;border-top:1px solid #161616;padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:space-between}
  .nav button{height:46px;min-width:50px}
  .nav .primario{flex:1 1 auto;max-width:240px}
  #abrir-prep,#pista{display:none!important}
  .escena{display:flex;flex-direction:column}
  #mapa{position:relative;inset:auto;flex:0 0 46%;min-height:0;background-size:40px 40px}   /* min-height:0: si no, el svg (height:100%) fija el alto del mapa al del paso anterior y el panel queda aplastado */
  body.p-hero #mapa{flex-basis:60%}
  body.p-pausa #mapa{flex-basis:40%}
  body.p-chico #mapa{display:none}
  #panel,body.p-hero #panel{position:relative;left:auto;top:auto;bottom:auto;width:auto;flex:1 1 auto;min-height:0;overflow-y:auto;
    border-radius:20px 20px 0 0;border-width:1px 0 0 0;border-color:var(--borde);background:var(--sup);padding:18px 16px 24px}
  body.p-chico #panel{border-radius:0;border-width:0}
  #capa{display:none!important}
  h1{font-size:36px}
  h2{font-size:25px}
  body.p-hero .bajada{font-size:18px}
  .ejemplo-chip{right:6px;bottom:3px;font-size:10.5px;padding:2px 8px}
  .col-t{letter-spacing:.05em}
  .col-q{display:none}
  .frase{font-size:14px}
  .nota{font-size:13.5px;padding:8px 10px}
  .nota.nota-duda{font-size:16px}
  .solo-pc{display:none!important}
  .solo-movil{display:block}
  .cifra b{font-size:40px}
  .mira{grid-template-columns:110px 1fr}
  .mira-fig svg{width:110px}
  /* los 7 modelos en celular: una sola columna, la lista entera se desliza */
  .mods{grid-template-columns:1fr;gap:0;margin-top:12px}
  .mod{padding:9px 10px 10px 8px}
  .mod b{font-size:16px}
  .mod span{font-size:14px}
  /* universo en celular: la grilla va dentro del panel, un fundamento abajo del otro */
  .uni{grid-template-columns:1fr;gap:10px;margin-top:14px}
  .uni-t{font-size:11px;padding-bottom:4px;margin-bottom:6px}
  .uni-l{gap:3px}
  .uni-i{font-size:11px;padding:2px 8px}
  .uni.sub1 .uni-i.tuya{font-size:12.5px}
  .uni-fade{height:48px;margin-top:-48px}
  /* el muro en celular: tres columnas, que igual se vea lleno */
  .muro{columns:2;column-gap:8px}
  .vic{margin-bottom:8px}
  .diag{font-size:16.5px}
  .propuesta{font-size:15.5px}
  .conceptos li:first-child span{font-size:16.5px}
  .cadena{flex-wrap:wrap;row-gap:8px}
  .cadena li + li::before{width:14px;margin:0 4px}
  .cadena li span{display:none}
  .cadena li.sigue span{display:inline}
  .burbuja{font-size:11.5px;width:60%;padding:6px 8px}
}
@media (max-height:700px) and (min-width:820px){
  #panel{padding:18px 22px 16px}
  .bloque{margin-top:12px}
  .cifra b{font-size:44px}
  .tarjeta{margin-top:12px;padding:14px}
  .mod{padding:8px 10px 9px 8px}
  .caso{margin-top:12px;padding:10px 13px}
  .etapa{padding:8px 12px}
  .semlist button{padding:9px 12px}
  .linea li{padding-bottom:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .m-sistema .ar.viva .arista{stroke-dashoffset:0}
}

    { id: "esc-espalda", nombre: "Escape de espalda",   fundamento: "escapes", conceptos: ["Ganás la pelea de manos antes de moverte.", "Llevás tu espalda al piso del lado del brazo de abajo.", "Sacás primero el gancho de arriba: el otro se cae solo."] },
    { id: "esc-repos",   nombre: "Reponer guardia",     fundamento: "escapes", conceptos: ["Te movés antes: la cadera afuera cuando el peso todavía no llegó.", "Siempre un marco entre su hombro y tu cuello.", "Reponer no es esperar: es ir a buscarle la pierna."] },
    { id: "esc-tortuga", nombre: "Salir de la tortuga", fundamento: "escapes", conceptos: ["La tortuga es de paso, no de descanso: si te quedás, te toman la espalda.", "Te sentás hacia el lado libre, nunca hacia el que te controla.", "Codos pegados a las rodillas: sin huecos no entran los ganchos."] },

    { id: "esc-derribo", nombre: "Salir del derribo", fundamento: "escapes", conceptos: ["El derribo no termina cuando caés: termina cuando volvés a estar de frente.", "Te sentás y le enfrentás las caderas antes de que se acomode.", "Si no llegás a la guardia, pasás por la tortuga y salís de ahí."] },

    { id: "g-clamp",     nombre: "Clamp",               fundamento: "guardia", conceptos: ["Su brazo cruzado al medio es tuyo: lo cerrás contra tu pecho y no lo soltás.", "Con ese brazo adentro no tiene ni postura ni base.", "Es una posición de decisión: espalda, kimura o barrida."] },
    { id: "g-toplock",   nombre: "Top lock",            fundamento: "guardia", conceptos: ["Le trabás el brazo de arriba: de ahí en adelante lucha con un brazo menos.", "Desde abajo manda el que tiene el agarre, no el que tiene el peso.", "Si quiere sacar el brazo, te está dando la espalda."] },
    { id: "g-media",     nombre: "Media guardia",       fundamento: "guardia", conceptos: ["Codo y rodilla juntos y siempre de costado: si no te aplana, no te pasa.", "La pierna de abajo es un gancho, no un ancla.", "Buscás el brazo por abajo antes que la barrida."] },

    { id: "g-dlr",       nombre: "De La Riva",          fundamento: "guardia", conceptos: ["El gancho le saca la base: mientras se ocupa de no caerse, no te pasa.", "El agarre del talón manda más que el gancho.", "Si se sienta, ya estás abajo de su pierna."] },
    { id: "g-arana",     nombre: "Guardia araña",       fundamento: "guardia", conceptos: ["Tus pies en sus bíceps: su peso nunca llega a vos.", "Las piernas trabajan, los brazos solo sostienen.", "Cuando le estirás un brazo, el otro le queda corto: ahí aparece el hueco."] },
    { id: "g-lapela",    nombre: "Guardia con lapela",  fundamento: "guardia", conceptos: ["La lapela es un agarre que no se suelta: el que gasta es él.", "Le sacás la postura sin fuerza de brazo.", "Todo lo que atás abajo queda fuera de la pelea."] },

    { id: "g-sentada",   nombre: "Guardia sentada",     fundamento: "guardia", conceptos: ["Si te sentás primero, el agarre lo elegís vos.", "La mano al tobillo y el hombro adentro: de ahí sale todo."] },
    { id: "g-x",         nombre: "Guardia X",           fundamento: "guardia", conceptos: ["Le sacás una pierna de la base y el resto se cae solo.", "Se entra desde abajo, nunca de frente."] },

  else if (a === 'prep-copiar') {
    escribirHash(); var msj = function (t) { var m = $('#prep-msj'); if (m) m.textContent = t; };
    try { navigator.clipboard.writeText(location.href).then(function () { msj(I.prep.copiado); }, function () { msj(I.prep.noCopia); }); } catch (e) { msj(I.prep.noCopia); }
    return;
  }
  escribirHash(); conFoco($prepCaja, pintarPrep);
});
$prep.addEventListener('click', function (ev) { if (ev.target === $prep) cerrarPrep(); });
$prep.addEventListener('keydown', function (ev) { trampaFoco($prep, ev); });

/* ---------- eventos ---------- */
function accion(ev) {
  var b = ev.target.closest('[data-accion]'); if (!b) return;
  var a = b.getAttribute('data-accion'), v = b.getAttribute('data-v');
  if (a === 'perfil') { estado.perfil = +v; estado.eligio = true; estado.arista = null; refrescarTodo(); }
  else if (a === 'zona') { cancelarEscaneo(); ponerZona(+v); }
  else if (a === 'seguir') avanzar(true);
  else if (a === 'bocado-ampliar') { var bo = perfil().bocado || {}, f = fuenteVideo(bo.video); if (!f) return; $capa.innerHTML = ''; capaClave = ''; abrirLuz('<div class="marco v916">' + reproductor(f, esc(bo.quien || ''), true) + '</div>', '<b>' + esc(bo.quien || '') + '</b> · ' + esc(bo.detalle || '') + ' ' + linkAbrir(bo)); }
  else if (a === 'cargar-video') { var tv = CONFIG.testimonios[+v], ft = fuenteVideo(tv && tv.video); if (ft) { var d = document.createElement('div'); d.className = 'marco v916'; d.innerHTML = reproductor(ft, esc(tv.quien || ''), true); b.parentNode.replaceChild(d, b); } }
  else if (a === 'antes') alternarAntes(v === '1');
  else if (a === 'hilo') { estado.hilo = v === '1'; repintar(); }
  else if (a === 'nodo') tocarNodo(v);
  else if (a === 'canal') { estado.canal = +v; refrescarTodo(); }
  else if (a === 'ampliar-chat') { var tc = CONFIG.testimonios[+v] || {}, ic = fuenteImagen(tc.captura); if (ic) abrirLuz('<div class="marco libre">' + capturaHTML(ic, esc(tc.quien || ''), 'whatsapp') + '</div>', esc(tc.quien || '')); }
  else if (a === 'ampliar-correccion') { var img = fuenteImagen(CONFIG.acompanamiento.correccionCaptura), ok = img && b.querySelector('img'); abrirLuz(ok ? '<div class="marco libre">' + capturaHTML(img, T.correccion.altCaptura, 'correccion') + '</div>' : correccionMock(), ok ? esc((perfil().correccion || {}).nota || '') : ''); }
  else if (a === 'ampliar-forma') { var fo = CONFIG.acompanamiento.formas[estado.canal], im = fuenteImagen(fo.captura); if (im) abrirLuz('<div class="marco libre">' + capturaHTML(im, fo.nombre, fo.id) + '</div>', esc(fo.titulo)); }
}
$panel.addEventListener('click', accion);
$capa.addEventListener('click', accion);
$panel.addEventListener('mouseover', function (ev) { var b = ev.target.closest && ev.target.closest('[data-accion="zona"]'); if (b) { cancelarEscaneo(); ponerZona(+b.getAttribute('data-v')); } });
$panel.addEventListener('focusin', function (ev) { var b = ev.target.closest && ev.target.closest('[data-accion="zona"]'); if (b) { cancelarEscaneo(); ponerZona(+b.getAttribute('data-v')); } });
$panel.addEventListener('error', alFallarImagen, true);
$capa.addEventListener('error', alFallarImagen, true);   // el muro y las capturas de los pasos 5 y 6 viven acá
$luz.addEventListener('error', alFallarImagen, true);
$svg.addEventListener('click', function (ev) {
  var n = ev.target.closest('.nodo'); if (n) { tocarNodo(n.getAttribute('data-id')); return; }
  var t = ev.target.closest('.ar'); if (t) tocarArista(t.getAttribute('data-k'));
});
$svg.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var n = ev.target.closest('.nodo'), t = ev.target.closest('.ar');
  if (n) { ev.preventDefault(); ev.stopPropagation(); tocarNodo(n.getAttribute('data-id')); }
  else if (t) { ev.preventDefault(); ev.stopPropagation(); tocarArista(t.getAttribute('data-k')); }
});
$('#riel').addEventListener('click', function (ev) { var b = ev.target.closest('[data-cap]'); if (b) irA(PASOS.findIndex(function (q) { return q.cap === +b.getAttribute('data-cap'); }), { dir: 1 }); });
$('#ant').addEventListener('click', function () { retroceder(true); });
$('#sig').addEventListener('click', function () { avanzar(true); });
$('#abrir-prep').addEventListener('click', abrirPrep);
$('.salto').addEventListener('click', function (ev) { ev.preventDefault(); try { $panel.focus({ preventScroll: true }); } catch (e) {} });   // sin cambiar el hash (el hash guarda el paso)
$('#luz-x').addEventListener('click', cerrarLuz);
$luz.addEventListener('click', function (ev) { if (ev.target === $luz) cerrarLuz(); });
$luz.addEventListener('keydown', function (ev) { trampaFoco($luz, ev); });

document.addEventListener('keydown', function (ev) {
  if (ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (!$luz.hidden) { if (ev.key === 'Escape') cerrarLuz(); return; }
  if (!$prep.hidden) { if (ev.key === 'Escape') cerrarPrep(); return; }
  var tg = ev.target, enCampo = tg && tg.closest && tg.closest('input, textarea, select'); if (enCampo) return;
  var enControl = tg && tg.closest && tg.closest('button, a, [role="button"], [role="tab"], video');
  switch (ev.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': ev.preventDefault(); avanzar(); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': ev.preventDefault(); retroceder(); break;
    case ' ': if (!enControl) { ev.preventDefault(); if (ev.shiftKey) retroceder(); else avanzar(); } break;
    case 'Home': ev.preventDefault(); irA(0, { dir: 1 }); break;
    case 'End': ev.preventDefault(); irA(PASOS.length - 1, { dir: 1 }); break;
    case 'a': case 'A': alternarAntes(); break;
    case 'p': case 'P': ev.preventDefault(); abrirPrep(); break;
    case 'h': case 'H': estado.pistas = !estado.pistas; actualizarPista(); if (estado.pistas) mostrarPista(); break;
    case '1': case '2': case '3': irA(PASOS.findIndex(function (q) { return q.cap === +ev.key; }), { dir: 1 }); break;
  }
});

/* ayuda de teclas: solo desktop, aparece al mover el mouse y se va sola */
function actualizarPista() { var id = pasoActual().id; $pista.textContent = (I.pistas && (I.pistas[id] || I.pistas.base)) || ''; if (!estado.pistas) $pista.classList.remove('ver'); }
function mostrarPista() { if (!estado.pistas || movil || hayModal()) return; $pista.classList.add('ver'); clearTimeout(temporizadores.pista); temporizadores.pista = setTimeout(function () { $pista.classList.remove('ver'); }, 2600); }
document.addEventListener('mousemove', mostrarPista, { passive: true });

/* rueda / trackpad: un gesto = un paso. No vuelve a avanzar hasta que el gesto termina (180 ms sin eventos),
   así la inercia del trackpad no salta dos pasos. Si el gesto empezó scrolleando el panel, ese gesto no navega. */
var rueda = { acum: 0, bloqueada: false, scrolleo: false, t: 0 };
function puedeScrollear(el, dy) {
  while (el && el !== document.body && el.nodeType === 1) {
    if (el.scrollHeight > el.clientHeight + 2) { var o = getComputedStyle(el).overflowY; if ((o === 'auto' || o === 'scroll') && ((dy > 0 && el.scrollTop + el.clientHeight < el.scrollHeight - 1) || (dy < 0 && el.scrollTop > 0))) return true; }
    el = el.parentElement;
  }
  return false;
}
window.addEventListener('wheel', function (ev) {
  if (ev.ctrlKey || hayModal()) return;
  clearTimeout(rueda.t);
  rueda.t = setTimeout(function () { rueda.acum = 0; rueda.bloqueada = false; rueda.scrolleo = false; }, 180);
  if (rueda.bloqueada) return;
  if (puedeScrollear(ev.target, ev.deltaY)) { rueda.scrolleo = true; return; }
  if (rueda.scrolleo) return;
  rueda.acum += ev.deltaY;
  if (Math.abs(rueda.acum) > 60) { rueda.bloqueada = true; if (rueda.acum > 0) avanzar(true); else retroceder(true); rueda.acum = 0; }
}, { passive: true });

/* swipe: solo horizontal (el vertical queda libre para scrollear) */
var toque = null;
document.addEventListener('touchstart', function (ev) {
  if (ev.touches.length !== 1 || hayModal()) { toque = null; return; }
  var t = ev.touches[0];
  toque = { x: t.clientX, y: t.clientY, t: Date.now(), enCarrusel: !!(ev.target.closest && ev.target.closest('.carrusel')) };
}, { passive: true });
document.addEventListener('touchend', function (ev) {
  if (!toque) return; var t = ev.changedTouches[0], dx = t.clientX - toque.x, dy = t.clientY - toque.y, dt = Date.now() - toque.t, q = toque; toque = null;
  if (dt > 800 || q.enCarrusel) return;
  if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.6) { if (dx < 0) avanzar(true); else retroceder(true); }
}, { passive: true });

window.addEventListener('hashchange', function () {
  if (hashActual() === location.hash) return;
  var i = aplicarHash(leerHash()); irA(i >= 0 ? i : estado.paso, { forzar: true }); pintarCapa(true);
});
var pendienteResize = 0;
window.addEventListener('resize', function () {
  cancelAnimationFrame(pendienteResize);
  pendienteResize = requestAnimationFrame(function () {
    var eraMovil = movil; $svg.classList.add('sin-anim');
    if (mqMovil.matches !== eraMovil) { movil = mqMovil.matches; pintarPanel(false); capaClave = ''; }
    medir(); rellenarMinis(); pintarMapa(); pintarCapa();
  });
});

/* ---------- arranque ---------- */
document.title = CONFIG.marca.tituloPestana || document.title;
$('#marca-sello').textContent = CONFIG.marca.sello || '';
$('#marca-nombre').textContent = CONFIG.marca.nombre;
$('#marca-programa').textContent = CONFIG.marca.programa;
$('#sig-t').textContent = I.siguiente;
$('#sig').setAttribute('aria-label', I.siguiente);
$('#ant').setAttribute('aria-label', I.anterior);
$('#luz-x').setAttribute('aria-label', I.cerrar);
$('#abrir-prep').setAttribute('aria-label', I.prep.abrir);
$('#abrir-prep').setAttribute('title', I.prep.abrir + ' (P)');
$('#riel').setAttribute('aria-label', I.recorridoAria);
$svg.setAttribute('aria-label', I.mapaAria);
var errores = validar();
if (errores.length) { var $av = $('#aviso'); $av.hidden = false; $av.innerHTML = '<b>' + esc(I.avisoConfig) + '</b>' + errores.map(esc).join('<br>'); }
var inicial = aplicarHash(leerHash());
irA(inicial >= 0 ? inicial : 0, { forzar: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { medir(); rellenarMinis(); pintarMapa(); });
})();
</script>
